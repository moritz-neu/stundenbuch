<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zeitnachweis</title>
<meta name="description" content="Private Aufzeichnung von Arbeits- und Reisezeiten, Daten bleiben auf dem Gerät.">
<meta name="theme-color" content="#1f5f8b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{
  --bg:#f5f6f8; --card:#ffffff; --text:#1b1f24; --muted:#5f6b78; --line:#dde2e8;
  --accent:#1f5f8b; --accent-text:#ffffff; --ok:#1d7a46; --warn:#a15c00; --bad:#b3261e;
  --warn-bg:#fff4e0; --bad-bg:#fdeceb; --ok-bg:#e7f5ec; --chip:#eef2f6;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121417; --card:#1c1f24; --text:#e8ebef; --muted:#9aa5b1; --line:#2e333a;
    --accent:#5aa7dc; --accent-text:#0b1a26; --ok:#5cc48a; --warn:#f0b45a; --bad:#f2817a;
    --warn-bg:#33270f; --bad-bg:#3a1a18; --ok-bg:#15301f; --chip:#262b31;
  }
}
:root[data-theme="dark"]{
  --bg:#121417; --card:#1c1f24; --text:#e8ebef; --muted:#9aa5b1; --line:#2e333a;
  --accent:#5aa7dc; --accent-text:#0b1a26; --ok:#5cc48a; --warn:#f0b45a; --bad:#f2817a;
  --warn-bg:#33270f; --bad-bg:#3a1a18; --ok-bg:#15301f; --chip:#262b31;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:80px}
main{max-width:640px;margin:0 auto;padding:12px 16px}
h1{font-size:1.3rem;margin:4px 0 12px}
h2{font-size:1.05rem;margin:18px 0 8px}
h3{font-size:1rem;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:0 0 12px}
.muted{color:var(--muted);font-size:.9rem}
.small{font-size:.82rem}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.end{justify-content:flex-end}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.row > input,.row > select{min-width:0;flex:1 1 0}
.row > button{flex:0 0 auto}
button{font:inherit;border:1px solid var(--line);background:var(--chip);color:var(--text);border-radius:10px;padding:10px 14px;cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
button.danger{color:var(--bad)}
button.big{padding:18px 10px;font-size:1.05rem;font-weight:600;width:100%}
button.link{background:none;border:none;color:var(--accent);padding:4px 0}
label{display:block;font-size:.85rem;color:var(--muted);margin:8px 0 3px}
input,select,textarea{font:inherit;width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text)}
input[type=checkbox]{width:auto;transform:scale(1.3);margin-right:8px}
.check{display:flex;align-items:center;color:var(--text);font-size:.95rem;margin:10px 0}
textarea{min-height:60px}
fieldset{border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0}
legend{font-size:.85rem;color:var(--muted);padding:0 4px}
.stat{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)}
.stat:last-child{border-bottom:none}
.stat b{font-variant-numeric:tabular-nums}
.warn{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:8px 10px;margin:6px 0;font-size:.9rem}
.bad{background:var(--bad-bg);color:var(--bad);border-radius:8px;padding:8px 10px;margin:6px 0;font-size:.9rem}
.good{background:var(--ok-bg);color:var(--ok);border-radius:8px;padding:8px 10px;margin:6px 0;font-size:.9rem}
.day{display:flex;justify-content:space-between;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.day:last-child{border-bottom:none}
.day .d{font-weight:600}
.day.empty .d{color:var(--muted);font-weight:400}
.day.storno .d{text-decoration:line-through;color:var(--muted)}
.chip{display:inline-block;background:var(--chip);border-radius:999px;padding:2px 9px;font-size:.8rem;margin-left:4px}
.status{font-size:1.1rem;font-weight:600;margin-bottom:6px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
nav button{background:none;border:none;font-size:.85rem;color:var(--muted);padding:8px 10px}
nav button.on{color:var(--accent);font-weight:700}
.banner{margin:0 0 10px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:var(--card);width:100%;max-width:640px;border-radius:14px 14px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:999px;z-index:60;font-size:.9rem;max-width:90vw}
.ver{border-left:3px solid var(--line);padding:4px 0 4px 10px;margin:8px 0}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:.78rem;word-break:break-all}
#print{display:none}
@media print{
  body{background:#fff;color:#000;padding:0}
  main,nav,.toast,.modal{display:none!important}
  #print{display:block;font-size:10pt}
  #print table{border-collapse:collapse;width:100%}
  #print th,#print td{border:1px solid #999;padding:2px 4px;text-align:left;vertical-align:top}
  #print h1{font-size:14pt}
}
</style>
</head>
<body>
<main id="app"><p class="muted">Lade ...</p></main>
<nav id="nav">
  <button data-act="nav:heute">Heute</button>
  <button data-act="nav:tage">Tage</button>
  <button data-act="nav:monat">Monat</button>
  <button data-act="nav:mehr">Mehr</button>
</nav>
<div id="print"></div>
<script>
'use strict';
/* ========== Hilfsfunktionen ========== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const WT = ['So','Mo','Di','Mi','Do','Fr','Sa'];
const MONATE = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];

function todayStr(d = new Date()){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function hhmm(d = new Date()){ return pad(d.getHours())+':'+pad(d.getMinutes()); }
function dayNum(s){ const [y,m,d] = s.split('-').map(Number); return Date.UTC(y, m-1, d) / 864e5; }
function fromNum(n){ const d = new Date(n * 864e5); return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate()); }
function weekday(s){ return new Date(dayNum(s) * 864e5).getUTCDay(); }
function addDays(s, n){ return fromNum(dayNum(s) + n); }
function fmtDate(s){ const [y,m,d] = s.split('-'); return WT[weekday(s)]+' '+d+'.'+m+'.'+y; }
function fmtDT(iso){ const d = new Date(iso); return pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'+d.getFullYear()+' '+hhmm(d); }
function toMin(t){ if(!t || !/^\d{1,2}:\d{2}$/.test(t)) return null; const [h,m] = t.split(':').map(Number); return h*60+m; }
function fmtH(min){ min = Math.round(min || 0); const s = min < 0 ? '-' : ''; min = Math.abs(min); return s+Math.floor(min/60)+':'+pad(min%60)+' h'; }
function decH(min){ return ((min || 0) / 60).toFixed(2).replace('.', ','); }
function eur(x){ return (x || 0).toLocaleString('de-DE', {minimumFractionDigits:2, maximumFractionDigits:2})+' €'; }
function num(v){ const x = parseFloat(String(v ?? '').replace(',', '.')); return isNaN(x) ? 0 : x; }
function monthOf(s){ return s.slice(0, 7); }
function fmtMonth(ym){ const [y,m] = ym.split('-'); return MONATE[+m-1]+' '+y; }
function addMonth(ym, n){ let [y,m] = ym.split('-').map(Number); m += n; while(m > 12){ m -= 12; y++; } while(m < 1){ m += 12; y--; } return y+'-'+pad(m); }
function daysIn(ym){ const [y,m] = ym.split('-').map(Number); return new Date(Date.UTC(y, m, 0)).getUTCDate(); }
function clone(o){ return JSON.parse(JSON.stringify(o)); }

/* ========== SHA-256 (ohne Bibliothek, funktioniert auch offline und als lokale Datei) ========== */
const K256 = [0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
const ror = (x, n) => (x >>> n) | (x << (32 - n));
function sha256(str){
  const m = new TextEncoder().encode(str), l = m.length;
  const buf = new Uint8Array(((l + 9 + 63) >> 6) * 64); buf.set(m); buf[l] = 0x80;
  const dv = new DataView(buf.buffer), bits = l * 8;
  dv.setUint32(buf.length - 4, bits >>> 0); dv.setUint32(buf.length - 8, Math.floor(bits / 4294967296));
  const H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const W = new Uint32Array(64);
  for(let i = 0; i < buf.length; i += 64){
    for(let t = 0; t < 16; t++) W[t] = dv.getUint32(i + t*4);
    for(let t = 16; t < 64; t++){
      const x = W[t-15], y = W[t-2];
      W[t] = (W[t-16] + (ror(x,7) ^ ror(x,18) ^ (x >>> 3)) + W[t-7] + (ror(y,17) ^ ror(y,19) ^ (y >>> 10))) >>> 0;
    }
    let [a,b,c,d,e,f,g,h] = H;
    for(let t = 0; t < 64; t++){
      const t1 = (h + (ror(e,6) ^ ror(e,11) ^ ror(e,25)) + ((e & f) ^ (~e & g)) + K256[t] + W[t]) >>> 0;
      const t2 = ((ror(a,2) ^ ror(a,13) ^ ror(a,22)) + ((a & b) ^ (a & c) ^ (b & c))) >>> 0;
      h = g; g = f; f = e; e = (d + t1) >>> 0; d = c; c = b; b = a; a = (t1 + t2) >>> 0;
    }
    H[0]=(H[0]+a)>>>0; H[1]=(H[1]+b)>>>0; H[2]=(H[2]+c)>>>0; H[3]=(H[3]+d)>>>0;
    H[4]=(H[4]+e)>>>0; H[5]=(H[5]+f)>>>0; H[6]=(H[6]+g)>>>0; H[7]=(H[7]+h)>>>0;
  }
  return H.map(x => x.toString(16).padStart(8, '0')).join('');
}
function stable(v){
  if(v === null || typeof v !== 'object') return JSON.stringify(v);
  if(Array.isArray(v)) return '['+v.map(stable).join(',')+']';
  return '{'+Object.keys(v).sort().filter(k => v[k] !== undefined).map(k => JSON.stringify(k)+':'+stable(v[k])).join(',')+'}';
}
const GENESIS = '0'.repeat(64);
function recHash(r){ return sha256(r.prevHash + stable({seq:r.seq, entity:r.entity, key:r.key, data:r.data, recordedAt:r.recordedAt, reason:r.reason, source:r.source})); }

/* ========== Feiertage ========== */
const LAENDER = {BW:'Baden-Württemberg',BY:'Bayern',BE:'Berlin',BB:'Brandenburg',HB:'Bremen',HH:'Hamburg',HE:'Hessen',MV:'Mecklenburg-Vorpommern',NI:'Niedersachsen',NW:'Nordrhein-Westfalen',RP:'Rheinland-Pfalz',SL:'Saarland',SN:'Sachsen',ST:'Sachsen-Anhalt',SH:'Schleswig-Holstein',TH:'Thüringen'};
function easter(y){
  const a=y%19, b=Math.floor(y/100), c=y%100, d=Math.floor(b/4), e=b%4, f=Math.floor((b+8)/25), g=Math.floor((b-f+1)/3);
  const h=(19*a+b-d-g+15)%30, i=Math.floor(c/4), k=c%4, l=(32+2*e+2*i-h-k)%7, m=Math.floor((a+11*h+22*l)/451);
  const mo=Math.floor((h+l-7*m+114)/31), da=((h+l-7*m+114)%31)+1;
  return y+'-'+pad(mo)+'-'+pad(da);
}
const holCache = {};
function holidays(y, bl){
  const ck = y+bl; if(holCache[ck]) return holCache[ck];
  const E = easter(y), H = {};
  const add = (d, n, list) => { if(!list || list.includes(bl)) H[d] = n; };
  add(y+'-01-01','Neujahr');
  add(y+'-01-06','Heilige Drei Könige',['BW','BY','ST']);
  add(y+'-03-08','Internationaler Frauentag',['BE','MV']);
  add(addDays(E,-2),'Karfreitag');
  add(E,'Ostersonntag',['BB']);
  add(addDays(E,1),'Ostermontag');
  add(y+'-05-01','Tag der Arbeit');
  add(addDays(E,39),'Christi Himmelfahrt');
  add(addDays(E,49),'Pfingstsonntag',['BB']);
  add(addDays(E,50),'Pfingstmontag');
  add(addDays(E,60),'Fronleichnam',['BW','BY','HE','NW','RP','SL']);
  add(y+'-08-15','Mariä Himmelfahrt',['SL']);
  add(y+'-09-20','Weltkindertag',['TH']);
  add(y+'-10-03','Tag der Deutschen Einheit');
  add(y+'-10-31','Reformationstag',['BB','HB','HH','MV','NI','SN','ST','SH','TH']);
  add(y+'-11-01','Allerheiligen',['BW','BY','NW','RP','SL']);
  const n22 = y+'-11-22'; add(addDays(n22, -((weekday(n22) - 3 + 7) % 7)),'Buß- und Bettag',['SN']);
  add(y+'-12-25','1. Weihnachtstag');
  add(y+'-12-26','2. Weihnachtstag');
  return holCache[ck] = H;
}
function holidayName(date, bl){ return holidays(+date.slice(0,4), bl || '').hasOwnProperty(date) ? holidays(+date.slice(0,4), bl || '')[date] : null; }

/* ========== Speicher (IndexedDB) ========== */
let db, LOG = [], META = {}, CUR = new Map();
function idbOpen(){
  return new Promise((res, rej) => {
    const r = indexedDB.open('zeitnachweis', 1);
    r.onupgradeneeded = () => { const d = r.result; d.createObjectStore('log', {keyPath:'seq'}); d.createObjectStore('meta'); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
function idbReq(store, mode, fn){
  return new Promise((res, rej) => {
    const t = db.transaction(store, mode), q = fn(t.objectStore(store));
    t.oncomplete = () => res(q && 'result' in q ? q.result : undefined);
    t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
  });
}
async function saveMeta(){ await idbReq('meta', 'readwrite', s => s.put(clone(META), 'meta')); }
function indexLog(){ CUR = new Map(); for(const r of LOG) CUR.set(r.entity+':'+r.key, r); }
async function append(entity, key, data, reason, source){
  const last = LOG[LOG.length - 1];
  const r = {seq: last ? last.seq + 1 : 1, entity, key, data: clone(data), recordedAt: new Date().toISOString(), reason: reason || '', source, prevHash: last ? last.hash : GENESIS};
  r.hash = recHash(r);
  await idbReq('log', 'readwrite', s => s.add(r));
  LOG.push(r); CUR.set(entity+':'+key, r);
  META.dirty = true; await saveMeta();
  scheduleDrive();
  return r;
}
function verifyChain(log){
  let prev = GENESIS;
  for(let i = 0; i < log.length; i++){
    const r = log[i];
    if(r.seq !== i + 1) return {ok:false, at:r.seq, why:'Lücke in der Nummerierung bei Eintrag '+(i+1)};
    if(r.prevHash !== prev) return {ok:false, at:r.seq, why:'Verkettung gebrochen bei Eintrag '+r.seq};
    if(recHash(r) !== r.hash) return {ok:false, at:r.seq, why:'Inhalt verändert bei Eintrag '+r.seq};
    prev = r.hash;
  }
  return {ok:true, n:log.length, head:prev};
}

/* ========== Einstellungen ========== */
const DEFAULT_SETTINGS = {name:'', start:'', bundesland:'', wochensoll:40, gehalt:[], mindestlohn:[{jahr:2026, betrag:13.90},{jahr:2027, betrag:14.60}]};
function settings(){ const r = CUR.get('settings:settings'); return Object.assign(clone(DEFAULT_SETTINGS), r ? r.data : {}); }
function gehaltFor(ym){
  const g = settings().gehalt.filter(x => x.ab && x.ab <= ym).sort((a,b) => a.ab < b.ab ? -1 : 1).pop();
  if(!g) return null;
  return g.art === 'jahr' ? num(g.betrag) / 12 : num(g.betrag);
}
function mindestlohnFor(y){ const m = settings().mindestlohn.filter(x => +x.jahr <= +y).sort((a,b) => a.jahr - b.jahr).pop(); return m ? num(m.betrag) : null; }

/* ========== Tage ========== */
function newDay(date){ return {datum:date, tagTyp:'Arbeit', ortTyp:'Homeoffice', ortKuerzel:'', stadt:'', bundesland:'', beginn:'', ende:'', pausen:[], faktH:'', faktKuerzel:'', internH:'', internArt:'', anlass:'', belege:'', notiz:'', reisen:[], live:[], storniert:false}; }
function getDay(date){
  const r = CUR.get('day:'+date); if(!r) return null;
  const d = Object.assign(newDay(date), clone(r.data));
  d.pausen = d.pausen.map(p => Object.assign({art:'Pause'}, p));
  return d;
}
function dayVersions(date){ return LOG.filter(r => r.entity === 'day' && r.key === date); }
function blOf(day){ return (day && day.bundesland) || settings().bundesland; }
function sollMin(date, day){
  const tt = day && !day.storniert ? day.tagTyp : 'Arbeit';
  const wd = weekday(date), st = settings().start;
  if(st && date < st) return 0;
  if(wd === 0 || wd === 6 || holidayName(date, blOf(day)) || tt === 'Feiertag') return 0;
  return num(settings().wochensoll) / 5 * 60;
}
function span(a, b){ const x = toMin(a), y = toMin(b); if(x === null || y === null) return null; return y >= x ? y - x : y + 1440 - x; }

function calc(date, day){
  const res = {arbeit:0, pause:0, pauseZaehlt:0, aktiv:0, passiv:0, km:0, fakt:0, intern:0, gutschrift:0, first:null, last:null, warnings:[], open:false};
  if(!day || day.storniert) return res;
  const base = dayNum(date) * 1440;
  const ivs = [];
  if(day.tagTyp === 'Urlaub' || day.tagTyp === 'Krank') res.gutschrift = sollMin(date, day);
  // Laufender Tag: offenes Ende vorläufig mit der aktuellen Uhrzeit rechnen
  const now = date === todayStr() ? hhmm() : null;
  const b = toMin(day.beginn);
  let ende = day.ende;
  if(b !== null && !ende){ res.open = true; if(now) { ende = now; res.vorlaeufig = true; } }
  const e = toMin(ende);
  let wStart = null, wEnd = null;
  if(b !== null && e !== null){
    wStart = base + b; wEnd = wStart + span(day.beginn, ende);
    for(const p of day.pausen){
      const d = span(p.von, p.bis || (now && p.von ? now : ''));
      if(p.von && !p.bis) res.open = true;
      if(d === null) continue;
      res.pause += d;
      // Unterbrechung (z. B. geteilter Dienst) wird abgezogen, gilt aber nicht als Ruhepause
      if(d >= 15 && p.art !== 'Unterbrechung') res.pauseZaehlt += d;
    }
    ivs.push([wStart, wEnd]);
    if(wEnd - wStart > 960) res.warnings.push('Zwischen Beginn und Ende liegen über 16 Stunden. Bitte prüfen, ob das Ende vergessen wurde.');
  }
  let overlap = 0;
  for(const r of day.reisen){
    if(r.ab && !r.an) res.open = true;
    const d = span(r.ab, r.an || (now && r.ab ? now : ''));
    if(d === null) continue;
    const akt = r.selbst ? d : Math.min(num(r.gearbeitetMin), d);
    res.aktiv += akt; res.passiv += d - akt; res.km += num(r.km);
    const s = base + toMin(r.ab), en = s + d;
    if(akt > 0) ivs.push([s, en]);
    // Reise innerhalb der Arbeitszeit zählt als Reise, nicht zusätzlich als Arbeit
    if(wStart !== null) overlap += Math.max(0, Math.min(en, wEnd) - Math.max(s, wStart));
  }
  if(wStart !== null) res.arbeit = Math.max(0, (wEnd - wStart) - res.pause - overlap);
  // Intern ist der Rest der Arbeitszeit nach Abzug der fakturierten Stunden
  res.fakt = num(day.faktH) * 60; res.intern = Math.max(0, res.arbeit - res.fakt);
  if(ivs.length){ res.first = Math.min(...ivs.map(i => i[0])); res.last = Math.max(...ivs.map(i => i[1])); }
  const arbzg = res.arbeit + res.aktiv;
  res.arbzg = arbzg;
  if(arbzg > 600) res.warnings.push('Über 10 Stunden Arbeitszeit ('+fmtH(arbzg)+' inkl. aktiver Reisezeit), Grenze nach § 3 ArbZG.');
  if(arbzg > 540 && res.pauseZaehlt < 45) res.warnings.push('Über 9 Stunden Arbeitszeit, aber weniger als 45 min Ruhepause (Abschnitte ab 15 min), § 4 ArbZG.');
  else if(arbzg > 360 && res.pauseZaehlt < 30) res.warnings.push('Über 6 Stunden Arbeitszeit, aber weniger als 30 min Ruhepause (Abschnitte ab 15 min), § 4 ArbZG.');
  const tatig = res.arbeit + res.aktiv + res.passiv > 0;
  const hn = holidayName(date, blOf(day));
  if(tatig && hn) res.warnings.push('Tätigkeit am Feiertag '+hn+' ('+(LAENDER[blOf(day)] || 'Bundesland fehlt')+').');
  else if(tatig && weekday(date) === 0) res.warnings.push('Tätigkeit an einem Sonntag.');
  if(res.open && date < todayStr()) res.warnings.push('Offener Eintrag: Arbeit, Pause oder Reise ohne Ende.');
  if(res.fakt > res.arbeit && !res.vorlaeufig) res.warnings.push('Fakturiert ('+fmtH(res.fakt)+') ist mehr als die Arbeitszeit ('+fmtH(res.arbeit)+'). Bitte prüfen.');
  return res;
}
function calcWithRest(date){
  const day = getDay(date), c = calc(date, day);
  if(c.first !== null){
    const prev = calc(addDays(date, -1), getDay(addDays(date, -1)));
    if(prev.last !== null){
      const rest = c.first - prev.last;
      if(rest < 660) c.warnings.unshift('Ruhezeit nur '+fmtH(rest)+' seit dem Vortag, mindestens 11 Stunden nach § 5 ArbZG.');
    }
  }
  return c;
}

function monthStats(ym){
  const today = todayStr(), n = daysIn(ym), rows = [];
  const S = {arbeit:0, aktiv:0, passiv:0, km:0, fakt:0, intern:0, gutschrift:0, pause:0, soll:0, sollBis:0, istBis:0, fehl:[], warnCount:0, tage:0};
  for(let i = 1; i <= n; i++){
    const date = ym+'-'+pad(i), day = getDay(date), c = calcWithRest(date), soll = sollMin(date, day);
    rows.push({date, day, c, soll});
    S.soll += soll;
    if(date <= today){ S.sollBis += soll; S.istBis += c.arbeit + c.gutschrift; if(date < today && soll > 0 && (!day || day.storniert)) S.fehl.push(date); }
    for(const k of ['arbeit','aktiv','passiv','km','fakt','intern','gutschrift','pause']) S[k] += c[k];
    S.warnCount += c.warnings.length;
    if(day && !day.storniert) S.tage++;
  }
  const g = gehaltFor(ym), ml = mindestlohnFor(ym.slice(0,4));
  const hA = (S.arbeit + S.aktiv + S.gutschrift) / 60, hB = (S.arbeit + S.aktiv + S.passiv + S.gutschrift) / 60;
  S.ml = {gehalt:g, ml, hA, hB, lohnA: g && hA ? g / hA : null, lohnB: g && hB ? g / hB : null,
          fehlA: g && ml ? Math.max(0, hA * ml - g) : null, fehlB: g && ml ? Math.max(0, hB * ml - g) : null};
  return {rows, S};
}

function openDay(){
  const t = todayStr(), y = addDays(t, -1);
  const isOpen = d => d && !d.storniert && ((d.beginn && !d.ende) || d.pausen.some(p => p.von && !p.bis) || d.reisen.some(r => r.ab && !r.an));
  const dt = getDay(t); if(isOpen(dt)) return {date:t, day:dt};
  const dy = getDay(y); if(isOpen(dy)) return {date:y, day:dy};
  return {date:t, day:dt || newDay(t)};
}

async function live(action){
  const now = new Date(), today = todayStr(now);
  let t = hhmm(now);
  const od = openDay();
  let date = od.date, day = getDay(date) || newDay(date), reason = '', source = 'live';
  if(action === 'arbeit_start' || action === 'reise_start'){ date = today; day = getDay(today) || newDay(today); }
  else if(date < today){
    // Offener Eintrag vom Vortag: echte Endzeit erfragen statt die Uhrzeit von jetzt zu nehmen
    const v = await modal('Offener Eintrag vom '+fmtDate(date), '<p class="muted">Wann war wirklich Schluss? Eine Uhrzeit vor dem Beginn zählt als nach Mitternacht.</p><label>Uhrzeit</label><input type="time" id="m-t" value="'+t+'"><label>Grund</label><textarea id="m-reason" placeholder="z. B. Beenden vergessen"></textarea>',
      [{label:'Abbrechen', value:null}, {label:'Speichern', cls:'primary', validate: m => { const ok = toMin(m.querySelector('#m-t').value) !== null && m.querySelector('#m-reason').value.trim().length >= 3; if(!ok) toast('Uhrzeit und Grund angeben'); return ok; }, read: m => ({t:m.querySelector('#m-t').value, r:m.querySelector('#m-reason').value.trim()})}]);
    if(!v) return;
    t = v.t; reason = v.r; source = 'live-nachtrag';
  }
  if(action === 'arbeit_start'){
    if(day.beginn && day.ende){ day.pausen.push({von:day.ende, bis:t, art: span(day.ende, t) > 120 ? 'Unterbrechung' : 'Pause'}); day.ende = ''; }
    else if(!day.beginn) day.beginn = t;
  } else if(action === 'pause_start'){ day.pausen.push({von:t, bis:'', art:'Pause'}); }
  else if(action === 'pause_ende'){ const p = day.pausen.find(p => p.von && !p.bis); if(p) p.bis = t; }
  else if(action === 'arbeit_ende'){ const p = day.pausen.find(p => p.von && !p.bis); if(p) p.bis = t; day.ende = t; }
  else if(action === 'reise_start'){
    const prev = [...day.reisen].reverse().find(r => r.an) || (getDay(addDays(today, -1)) || {reisen:[]}).reisen.slice(-1)[0];
    day.reisen.push({ab:t, an:'', von: prev ? prev.nach : '', nach: prev ? prev.von : '', mittel: prev ? prev.mittel : 'Auto', selbst: prev ? !!prev.selbst : true, gearbeitetMin:'', gearbeitetWas:'', km: prev ? prev.km : ''});
  } else if(action === 'reise_ende'){
    const r = day.reisen.find(r => r.ab && !r.an);
    if(r){
      r.an = t;
      const v = await modal('Reise '+r.ab+' bis '+t, legFields(r, 'm'), [{label:'Später', value:null}, {label:'Übernehmen', cls:'primary', read: m => readLeg(m, 'm')}]);
      if(v) Object.assign(r, v, {ab:r.ab, an:t});
    }
  }
  day.live.push({a:action, at:now.toISOString()});
  await append('day', date, day, reason, source);
  toast('Gespeichert: '+t);
  render();
}

  const lines = [head.map(q).join(';')];
  for(const r of rows){
    if(!r.day) continue;

    lines.push([fmtDate(r.date).slice(3), WT[weekday(r.date)], d.tagTyp, d.ortTyp, d.ortKuerzel, d.stadt, blOf(d), holidayName(r.date, blOf(d)) || '', d.beginn, d.ende, fmtVal('pausen', d.pausen), decH(c.pause), decH(c.arbeit), decH(c.fakt), d.faktKuerzel, decH(c.intern), d.internArt,
      d.reisen.map(x => x.ab+'-'+x.an+' '+x.von+'>'+x.nach+' '+x.mittel+(x.selbst ? ' selbst' : ' Fahrgast')+(num(x.gearbeitetMin) ? ' gearb. '+x.gearbeitetMin+' min '+x.gearbeitetWas : '')).join(' | '),

  }
  return '﻿'+lines.join('\r\n');

function download(name, text, type){

function backupName(){ const d = new Date(); return 'zeitnachweis-backup-'+todayStr(d)+'-'+pad(d.getHours())+pad(d.getMinutes())+'.json'; }
async function markBackup(){ META.lastBackup = new Date().toISOString(); await saveMeta(); }

async function importBackup(file){
  let obj;
  try{ obj = JSON.parse(await file.text()); } catch(e){ toast('Datei ist kein gültiges Backup'); return; }
  const valid = r => r && typeof r === 'object' && Number.isInteger(r.seq) && typeof r.hash === 'string' && typeof r.prevHash === 'string' && ['day','settings'].includes(r.entity) && typeof r.key === 'string' && r.data && typeof r.data === 'object';
  if(!obj || obj.app !== 'zeitnachweis' || !Array.isArray(obj.log) || !obj.log.every(valid)){ toast('Datei ist kein gültiges Zeitnachweis-Backup'); return; }
  obj.log.sort((a,b) => a.seq - b.seq);
  const v = verifyChain(obj.log);
  const ok = await confirmBox('Backup importieren', obj.log.length+' Einträge, Hashkette '+(v.ok ? 'intakt' : 'GEBROCHEN ('+v.why+')')+'. Der aktuelle Stand ('+LOG.length+' Einträge) wird ersetzt. Vorher ein Backup des aktuellen Stands machen, falls er Neues enthält.', 'Ersetzen');
  if(!ok) return;
  await idbReq('log', 'readwrite', s => { s.clear(); for(const r of obj.log) s.put(r); });
  LOG = obj.log.slice(); indexLog(); ST.sdraft = null;
  META.dirty = true; await saveMeta(); scheduleDrive();
  toast('Importiert'); render();
}

/* ========== Google Drive ========== */
const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';
let gisPromise = null, tokenClient = null, driveTimer = null, tokenResolve = null, tokenReject = null;
function loadGis(){
  if(gisPromise) return gisPromise;
  gisPromise = new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://accounts.google.com/gsi/client'; s.async = true; s.onload = res; s.onerror = () => { gisPromise = null; rej(new Error('Google-Anmeldung nicht erreichbar')); }; document.head.appendChild(s); });
  return gisPromise;
}
function getToken(){ try{ const t = JSON.parse(sessionStorage.getItem('drive-token') || 'null'); return t && t.exp > Date.now() + 60000 ? t.tok : null; } catch(e){ return null; } }
function setToken(tok, sec){ try{ sessionStorage.setItem('drive-token', JSON.stringify({tok, exp:Date.now() + sec * 1000})); } catch(e){} }
function clearToken(){ try{ sessionStorage.removeItem('drive-token'); } catch(e){} }
function requestToken(){
  // muss direkt aus einem Klick heraus aufgerufen werden, sonst blockiert der Browser das Anmeldefenster
  if(!window.google || !google.accounts){ return Promise.reject(new Error('Google-Anmeldung lädt noch, bitte gleich nochmal tippen')); }
  if(!tokenClient) tokenClient = google.accounts.oauth2.initTokenClient({client_id:META.driveClientId, scope:DRIVE_SCOPE,
    callback: r => { if(r.error){ tokenReject && tokenReject(new Error(r.error)); return; } setToken(r.access_token, r.expires_in); tokenResolve && tokenResolve(r.access_token); },
    error_callback: e => tokenReject && tokenReject(new Error(e.type === 'popup_closed' ? 'Anmeldung abgebrochen' : (e.type || 'Anmeldung fehlgeschlagen')))});
  return new Promise((res, rej) => { tokenResolve = res; tokenReject = rej; tokenClient.requestAccessToken({prompt: META.driveConnected ? '' : 'consent'}); });
}
async function gfetch(url, opt, tok){
  const r = await fetch(url, Object.assign({}, opt, {headers:Object.assign({Authorization:'Bearer '+tok}, (opt && opt.headers) || {})}));
  if(r.status === 401){ clearToken(); const e = new Error('Anmeldung abgelaufen'); e.auth = true; throw e; }
  if(!r.ok){ const e = new Error('Drive-Fehler '+r.status); e.status = r.status; throw e; }
  return r.json();
}
async function driveUpload(tok){
  if(!META.driveFolderId){
    const f = await gfetch('https://www.googleapis.com/drive/v3/files?fields=id', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name:'Zeitnachweis Backups', mimeType:'application/vnd.google-apps.folder'})}, tok);
    META.driveFolderId = f.id;
  }
  const today = todayStr(), name = 'zeitnachweis-backup-'+today+'.json', body = JSON.stringify(backupObj());
  let res;
  if(META.driveDayFile && META.driveDayFile.date === today){
    try{
      res = await gfetch('https://www.googleapis.com/upload/drive/v3/files/'+META.driveDayFile.id+'?uploadType=media&fields=id,modifiedTime,trashed', {method:'PATCH', headers:{'Content-Type':'application/json'}, body}, tok);
      if(res.trashed){ res = null; META.driveDayFile = null; META.driveFolderId = null; return driveUpload(tok); }
    }
    catch(e){ if(e.status !== 404) throw e; META.driveDayFile = null; }
  }
  if(!res){
    const bd = 'zeitnachweis'+Date.now();
    const mp = '--'+bd+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify({name, mimeType:'application/json', parents:[META.driveFolderId]})+'\r\n--'+bd+'\r\nContent-Type: application/json\r\n\r\n'+body+'\r\n--'+bd+'--';
    try{ res = await gfetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,modifiedTime', {method:'POST', headers:{'Content-Type':'multipart/related; boundary='+bd}, body:mp}, tok); }
    catch(e){ if(e.status === 404){ META.driveFolderId = null; await saveMeta(); } throw e; }
    META.driveDayFile = {date:today, id:res.id};
  }
  META.lastDrive = {at:res.modifiedTime, name}; META.lastBackup = new Date().toISOString(); META.drivePending = false; META.driveConnected = true;
  await saveMeta();
}
let driveBusy = false;
function softRender(){
  // Eingabemasken nicht neu zeichnen, sonst gehen ungespeicherte Eingaben verloren
  if(['heute','tage','monat'].includes(ST.view)) render();
}
async function driveRun(interactive){
  if(!META.driveClientId) return;
  if(driveBusy){ if(!interactive) scheduleDrive(); return; }
  let tok = getToken();
  if(!tok && interactive && !(window.google && google.accounts)){
    loadGis().catch(() => {});
    toast(navigator.onLine ? 'Google-Anmeldung lädt, bitte gleich nochmal tippen' : 'Offline, Drive-Backup wird nachgeholt');
    return;
  }
  driveBusy = true;
  const n = LOG.length;
  try{
    if(!tok){
      if(!interactive){ META.drivePending = true; await saveMeta(); softRender(); return; }
      tok = await requestToken();
    }
    await driveUpload(tok);
    if(LOG.length === n){ META.dirty = false; await saveMeta(); } else scheduleDrive();
    if(interactive) toast('In Drive gesichert');
  } catch(e){
    META.drivePending = true; await saveMeta();
    if(e.auth && interactive){ toast('Bitte nochmal tippen, Anmeldung wird erneuert'); }
    else if(interactive || !e.auth) toast(navigator.onLine ? e.message : 'Offline, Drive-Backup wird nachgeholt');
  } finally { driveBusy = false; }
  softRender();
}
function scheduleDrive(){ if(!META.driveClientId || !META.driveConnected) return; clearTimeout(driveTimer); driveTimer = setTimeout(() => driveRun(false), 3000); }
window.addEventListener('online', () => { if(META.drivePending && getToken()) driveRun(false); });

function render(){
  const app = $('#app');
  const v = {heute:viewHeute, tage:viewTage, monat:viewMonat, mehr:viewMehr, edit:viewEdit, versions:viewVersions}[ST.view];
  app.innerHTML = v();
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.act === 'nav:'+(ST.view === 'edit' || ST.view === 'versions' ? 'tage' : ST.view)));
  // Im Tageseditor die errechnete interne Zeit beim Tippen mitführen
  app.oninput = app.onchange = ST.view !== 'edit' ? null : () => { readEdit(); const el = $('#e-intern'); if(el) el.textContent = fmtH(calc(ST.edit, ST.draft).intern); };
  if(ST.view === 'mehr'){
    const p = $('#persist');
    if(p && navigator.storage && navigator.storage.persisted) navigator.storage.persisted().then(x => { p.textContent = x ? 'Speicher ist als dauerhaft markiert, der Browser löscht ihn nicht automatisch.' : 'Speicher ist nicht als dauerhaft markiert. App zum Startbildschirm hinzufügen und regelmäßig Backups machen.'; });
    const imp = $('#imp'); if(imp) imp.onchange = () => { if(imp.files[0]) importBackup(imp.files[0]).catch(e => toast('Import fehlgeschlagen: '+e.message)); imp.value = ''; };
  }
}
function startEdit(date){ ST.edit = date; ST.draft = getDay(date) || newDay(date); ST.view = 'edit'; render(); window.scrollTo(0, 0); }

document.addEventListener('click', async ev => {
  const el = ev.target.closest('[data-act]'); if(!el) return;
  const [act, arg] = el.dataset.act.split(/:(.*)/s);
  try{
    switch(act){
      case 'nav': ST.view = arg; ST.sdraft = null; render(); window.scrollTo(0, 0); break;
      case 'live': await live(arg); break;
      case 'edit': startEdit(arg); break;
      case 'edit-pick': {
        const d = await modal('Tag nachtragen', '<label>Datum</label><input type="date" id="m-date" max="'+todayStr()+'" value="'+todayStr()+'">', [{label:'Abbrechen', value:null}, {label:'Öffnen', cls:'primary', read: m => m.querySelector('#m-date').value}]);
        if(d) startEdit(d); break;
      }
      case 'month': ST.month = addMonth(ST.month, +arg); render(); break;
      case 'back': ST.view = 'tage'; ST.month = monthOf(ST.edit); render(); break;
      case 'back-edit': ST.view = 'edit'; render(); break;
      case 'versions': readEdit(); ST.view = 'versions'; render(); window.scrollTo(0, 0); break;
      case 'add-pause': readEdit(); ST.draft.pausen.push({von:'', bis:'', art:'Pause'}); render(); break;
      case 'del-pause': readEdit(); ST.draft.pausen.splice(+arg, 1); render(); break;
      case 'add-reise': readEdit(); ST.draft.reisen.push({ab:'', an:'', von:'', nach:'', mittel:'Auto', selbst:true, gearbeitetMin:'', gearbeitetWas:'', km:''}); render(); break;
      case 'del-reise': readEdit(); ST.draft.reisen.splice(+arg, 1); render(); break;
      case 'save-day': await saveDay(); break;
      case 'storno': case 'restore': {
        const reason = await askReason(act === 'storno' ? 'Warum wird dieser Tag storniert? Er bleibt als Version sichtbar.' : 'Warum wird der Tag wiederhergestellt?');
        if(reason === null) break;
        const d = getDay(ST.edit); d.storniert = act === 'storno';
        await append('day', ST.edit, d, reason, 'manuell'); startEdit(ST.edit); toast(act === 'storno' ? 'Storniert' : 'Wiederhergestellt'); break;
      }
      case 'add-gehalt': readSettings(); ST.sdraft.gehalt.push({ab:monthOf(todayStr()), betrag:'', art:'monat'}); render(); break;
      case 'del-gehalt': readSettings(); ST.sdraft.gehalt.splice(+arg, 1); render(); break;
      case 'add-ml': readSettings(); ST.sdraft.mindestlohn.push({jahr:new Date().getFullYear() + 1, betrag:''}); render(); break;
      case 'del-ml': readSettings(); ST.sdraft.mindestlohn.splice(+arg, 1); render(); break;
      case 'save-settings': readSettings(); await append('settings', 'settings', ST.sdraft, '', 'manuell'); ST.sdraft = null; toast('Einstellungen gespeichert'); render(); break;
      case 'csv': download('zeitnachweis-'+ST.month+'.csv', csvMonth(ST.month), 'text/csv;charset=utf-8'); break;
      case 'print': printMonth(); break;
      case 'share-backup': await shareBackup(); break;
      case 'dl-backup': download(backupName(), JSON.stringify(backupObj(), null, 1), 'application/json'); await markBackup(); render(); break;
      case 'import': $('#imp').click(); break;
      case 'drive-save-id': {
        const id = $('#d-cid').value.trim();
        if(!/\.apps\.googleusercontent\.com$/.test(id)){ toast('Das sieht nicht wie eine Client-ID aus'); break; }
        META.driveClientId = id; tokenClient = null; await saveMeta(); loadGis().catch(() => {}); render(); break;
      }
      case 'drive-upload': await driveRun(true); break;
      case 'drive-disconnect': {
        const tok = getToken(); if(tok && window.google) google.accounts.oauth2.revoke(tok, () => {});
        clearToken(); META.driveConnected = false; META.drivePending = false; await saveMeta(); toast('Drive getrennt'); render(); break;
      }
      case 'drive-reset': META.driveClientId = ''; META.driveConnected = false; META.drivePending = false; META.driveFolderId = null; META.driveDayFile = null; tokenClient = null; clearToken(); await saveMeta(); render(); break;
    }
  } catch(e){ console.error(e); toast('Fehler: '+e.message); }
});

(async function init(){
  try{
    db = await idbOpen();
    LOG = (await idbReq('log', 'readonly', s => s.getAll())).sort((a,b) => a.seq - b.seq);
    META = (await idbReq('meta', 'readonly', s => s.get('meta'))) || {};
    indexLog();
    if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
    if(META.driveClientId) loadGis().catch(() => {});
    if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
    render();
    if(META.driveConnected && META.dirty){
      if(getToken()) driveRun(false);
      else if(!META.drivePending){ META.drivePending = true; await saveMeta(); render(); }
    }
  } catch(e){
    $('#app').innerHTML = '<div class="bad">Speicher nicht verfügbar: '+esc(e.message)+'. Bitte die App über https oder in Firefox öffnen.</div>';
  }
})();
</script>
